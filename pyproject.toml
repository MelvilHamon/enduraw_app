[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enduraw-app"
version = "0.1.0"
description = "Enduraw Form Tracker — endurance athlete readiness analysis API."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Enduraw" }]
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn[standard]>=0.27,<0.31",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<1.14",
    "pydantic[email]>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-jose[cryptography]>=3.3,<4",
    "bcrypt>=4.1,<5",
    "httpx>=0.27,<0.28",
    "python-multipart>=0.0.9",
    "numpy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<0.24",
    "pytest-cov>=5,<6",
    "respx>=0.21,<0.22",
    "ruff>=0.4,<0.6",
    "black>=24,<25",
    "mypy>=1.10,<2",
    "pre-commit>=3.7,<4",
    "types-python-jose",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
exclude = "tests/"
plugins = []

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
